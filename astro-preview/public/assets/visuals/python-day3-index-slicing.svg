<svg xmlns="http://www.w3.org/2000/svg" width="800" height="286" viewBox="0 0 800 286" role="img" aria-labelledby="title desc"><title id="title">리스트 인덱싱과 슬라이싱</title><desc id="desc">numbers는 10,20,30,40,50입니다. 양수 인덱스는 0부터 4, 음수 인덱스는 -5부터 -1입니다. numbers[1:4]는 20,30,40을 선택하고 끝 인덱스 4에 있는 50은 포함되지 않습니다.</desc><rect width="800" height="286" rx="18" fill="#f6fbf8"/><text x="52" y="25" font-size="15" font-weight="800" fill="#205e4f" font-family="system-ui,sans-serif">numbers = [10, 20, 30, 40, 50]</text><g font-family="system-ui,sans-serif"><g><text x="112" y="47" font-size="17" fill="#2f7762" font-weight="700" text-anchor="middle">0</text><rect x="54" y="69" width="116" height="83" rx="11" fill="#fff" stroke="#bfdbcc" stroke-width="1.7" /><text x="112" y="120" text-anchor="middle" font-size="25" font-weight="800" fill="#244139">10</text><text x="112" y="181" font-size="15" text-anchor="middle" fill="#709186">-5</text></g>
<g><text x="241" y="47" font-size="17" fill="#2f7762" font-weight="700" text-anchor="middle">1</text><rect x="183" y="69" width="116" height="83" rx="11" fill="#def4e9" stroke="#168574" stroke-width="2.6" /><text x="241" y="120" text-anchor="middle" font-size="25" font-weight="800" fill="#244139">20</text><text x="241" y="181" font-size="15" text-anchor="middle" fill="#709186">-4</text></g>
<g><text x="370" y="47" font-size="17" fill="#2f7762" font-weight="700" text-anchor="middle">2</text><rect x="312" y="69" width="116" height="83" rx="11" fill="#def4e9" stroke="#168574" stroke-width="2.6" /><text x="370" y="120" text-anchor="middle" font-size="25" font-weight="800" fill="#244139">30</text><text x="370" y="181" font-size="15" text-anchor="middle" fill="#709186">-3</text></g>
<g><text x="499" y="47" font-size="17" fill="#2f7762" font-weight="700" text-anchor="middle">3</text><rect x="441" y="69" width="116" height="83" rx="11" fill="#def4e9" stroke="#168574" stroke-width="2.6" /><text x="499" y="120" text-anchor="middle" font-size="25" font-weight="800" fill="#244139">40</text><text x="499" y="181" font-size="15" text-anchor="middle" fill="#709186">-2</text></g>
<g><text x="628" y="47" font-size="17" fill="#2f7762" font-weight="700" text-anchor="middle">4</text><rect x="570" y="69" width="116" height="83" rx="11" fill="#fff" stroke="#bfdbcc" stroke-width="1.7" stroke-dasharray="6 4"/><text x="628" y="120" text-anchor="middle" font-size="25" font-weight="800" fill="#244139">50</text><text x="628" y="181" font-size="15" text-anchor="middle" fill="#709186">-1</text></g></g><path d="M175 200H560" stroke="#168574" stroke-width="3" stroke-linecap="round"/><path d="M175 194V206 M560 194V206" stroke="#168574" stroke-width="3"/><text x="52" y="237" font-size="17" font-family="system-ui,sans-serif" fill="#205e4f" font-weight="750">numbers[1:4] = [20, 30, 40]</text><text x="52" y="265" font-size="14" font-family="system-ui,sans-serif" fill="#708d82">시작 1 포함 · 끝 4 제외 · 음수 인덱스는 뒤에서부터 셉니다</text></svg>