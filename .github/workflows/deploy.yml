name: Publish HangJoo Astro to branch Pages root

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "hangjoo-root-publish"
  cancel-in-progress: false

jobs:
  publish-verified-astro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build latest Astro site
        working-directory: astro-preview
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run check:output

      - name: Preserve old root and synchronize Astro build
        shell: bash
        run: |
          set -euo pipefail
          # Pages currently publishes main:/ (legacy root), NOT Astro dist.
          # Preserve original root's content before replacing published outputs.
          mkdir -p legacy-site-backup
          if [ ! -f legacy-site-backup/index.html ]; then
            cp index.html legacy-site-backup/index.html
          fi
          if [ ! -d legacy-site-backup/posts ] && [ -d posts ]; then
            cp -a posts legacy-site-backup/posts
          fi
          # Copy *only* compiled public output. Never touch Astro sources.
          cp astro-preview/dist/index.html index.html
          for file in writing.html about.html; do
            cp "astro-preview/dist/$file" "$file"
          done
          for dir in posts categories labs _astro; do
            mkdir -p "$dir"
            rsync -a "astro-preview/dist/$dir/" "$dir/"
          done
          mkdir -p assets/visuals
          rsync -a astro-preview/dist/assets/visuals/ assets/visuals/
          touch .nojekyll
          # Ensure the public root is the verified Clean Mint site.
          grep -q 'Study Notes' index.html
          grep -q '\[03_4\]' categories/study.html
          test -f posts/2026-11-24-python-series-01-01.html
          test -f labs/list-copy/index.html

      - name: Commit compiled public output for branch Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html writing.html about.html posts/ categories/ labs/ _astro/ assets/visuals/ .nojekyll legacy-site-backup/
          if git diff --cached --quiet; then
            echo "Compiled Astro output already matches published Pages root"
          else
            git commit -m "build: sync verified Astro to Pages branch root [skip ci]"
            git push origin HEAD:main
          fi
