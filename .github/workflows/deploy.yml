name: Deploy HangJoo Astro to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Astro site
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify public routes, original URL, and only approved posts
        run: npm run check:output

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Astro dist only
        uses: actions/upload-pages-artifact@v3
        with:
          path: "astro-preview/dist"

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..15}; do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo 0)
            if [ "$count" = "1" ]; then
              echo "Pages artifact indexed in GitHub API"
              exit 0
            fi
            echo "Pages artifact not yet indexed, attempt $attempt/15"
            sleep 6
          done
          echo "Pages artifact unavailable to deployment API"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
