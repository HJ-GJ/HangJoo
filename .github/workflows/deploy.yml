name: Deploy HangJoo Astro to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Astro site
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify public routes, original URL, and only approved posts
        run: npm run check:output

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Astro dist only
        uses: actions/upload-pages-artifact@v3
        with:
          path: "astro-preview/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
