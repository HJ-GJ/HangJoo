name: HangJoo Editorial Pipeline — Scheduled Drive Check & Discord Notify

on:
  schedule:
    # 06:30 KST (21:30 UTC) and 18:00 KST (09:00 UTC)
    - cron: '30 21 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip Drive upload and Discord webhook)'
        type: boolean
        default: true
      max_files:
        description: 'Max new drafts to process per run'
        type: number
        default: 1

permissions:
  contents: read

jobs:
  check-inbox-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Drive API client
        run: python3 -m pip install --no-cache-dir google-api-python-client google-auth

      - name: Pull isolated Python sandbox image
        run: docker pull python:3.12-alpine

      - name: Run pipeline unit tests
        run: python3 -m unittest discover -s scripts/editorial-pipeline -p "test_*.py" -v

      - name: Poll Drive 01_INBOX_Drafts, run Gates 1-3, and notify Discord
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DRY_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          MAX_FILES="${{ inputs.max_files || 1 }}"
          python3 scripts/editorial-pipeline/drive_actions_runner.py $DRY_FLAG --max-files "$MAX_FILES"

      - name: Upload review reports backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hangjoo-editorial-review-reports
          path: /tmp/hangjoo_actions_pipeline/
          retention-days: 14
          if-no-files-found: ignore
