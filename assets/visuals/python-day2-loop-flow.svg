<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 485" width="940" height="485" role="img" aria-labelledby="loop-title loop-desc">
<title id="loop-title">for와 while 반복문의 실행 흐름</title>
<desc id="loop-desc">for는 다음 값이 있는지 확인하고 값을 가져와 반복한다. while은 조건이 참인지 확인하고 코드를 실행하며, 각 조건이 끝나면 반복문을 종료한다.</desc>
<defs>
  <marker id="loop-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L6 4 L1 7" stroke="#168574" stroke-width="1.8" stroke-linejoin="round" fill="none"/></marker>
</defs>
<rect width="940" height="485" rx="22" fill="#F7FAF9"/>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" text-anchor="middle">
  <rect x="20" y="20" width="440" height="442" rx="19" fill="#fff" stroke="#DFE9E5" stroke-width="2"/>
  <rect x="480" y="20" width="440" height="442" rx="19" fill="#fff" stroke="#DFE9E5" stroke-width="2"/>
  <text x="240" y="75" font-size="30" font-weight="750" fill="#202B2A">for</text>
  <text x="700" y="75" font-size="30" font-weight="750" fill="#202B2A">while</text>
  <text x="240" y="109" font-size="17" fill="#64736E">다음 값을 가져와 반복</text>
  <text x="700" y="109" font-size="17" fill="#64736E">조건이 참인 동안 반복</text>

  <rect x="110" y="143" width="260" height="65" rx="13" fill="#E6F5F0" stroke="#A8D9CA"/>
  <rect x="570" y="143" width="260" height="65" rx="13" fill="#E6F5F0" stroke="#A8D9CA"/>
  <text x="240" y="184" font-size="21" font-weight="700" fill="#168574">다음 값이 있을까?</text>
  <text x="700" y="184" font-size="21" font-weight="700" fill="#168574">조건이 참일까?</text>

  <path d="M240 209 V252" fill="none" stroke="#168574" stroke-width="2.7" marker-end="url(#loop-arrow)"/>
  <path d="M700 209 V252" fill="none" stroke="#168574" stroke-width="2.7" marker-end="url(#loop-arrow)"/>
  <text x="256" y="235" text-anchor="start" font-size="14" fill="#168574">예</text>
  <text x="716" y="235" text-anchor="start" font-size="14" fill="#168574">참</text>

  <rect x="118" y="259" width="244" height="61" rx="12" fill="#F7FAF9" stroke="#CFDED9"/>
  <rect x="580" y="259" width="240" height="61" rx="12" fill="#F7FAF9" stroke="#CFDED9"/>
  <text x="240" y="298" font-size="21" font-weight="650" fill="#202B2A">코드 실행</text>
  <text x="700" y="298" font-size="20" font-weight="650" fill="#202B2A">코드 실행 · 값 갱신</text>

  <!-- Repeat path returns to the predicate after the operation -->
  <path d="M118 288 H64 V175 H108" fill="none" stroke="#168574" stroke-width="2.4" marker-end="url(#loop-arrow)"/>
  <path d="M580 288 H525 V175 H568" fill="none" stroke="#168574" stroke-width="2.4" marker-end="url(#loop-arrow)"/>
  <!-- False branch is spaced far enough from labels and panels -->
  <path d="M371 175 H425 V382 H330" fill="none" stroke="#168574" stroke-width="2.4" marker-end="url(#loop-arrow)"/>
  <path d="M831 175 H886 V382 H790" fill="none" stroke="#168574" stroke-width="2.4" marker-end="url(#loop-arrow)"/>
  <text x="383" y="229" text-anchor="start" font-size="14" font-weight="600" fill="#168574">아니오</text>
  <text x="846" y="229" text-anchor="start" font-size="14" font-weight="600" fill="#168574">거짓</text>

  <rect x="161" y="351" width="168" height="60" rx="12" fill="#fff" stroke="#93B7AA" stroke-width="2"/>
  <rect x="625" y="351" width="165" height="60" rx="12" fill="#fff" stroke="#93B7AA" stroke-width="2"/>
  <text x="245" y="389" font-size="20" fill="#202B2A">반복 종료</text>
  <text x="708" y="389" font-size="20" fill="#202B2A">반복 종료</text>
</g>
</svg>