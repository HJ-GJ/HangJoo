<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img" aria-labelledby="title desc">
<title id="title">시간을 분으로 변환하고 다시 시분으로 복원하는 흐름</title><desc id="desc">23시40분에 35분을 더하면 1455분이고 24시간제로 복원하면 0시15분이다.</desc>
<rect width="780" height="260" rx="16" fill="#FFFEF2"/>
<text x="32" y="39" font-family="sans-serif" font-size="16" font-weight="700" fill="#285E4F">TIME ARITHMETIC · // AND %</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="35" y="85" width="205" height="100" rx="13" fill="#F5F3E9" stroke="#285E4F" stroke-width="2"/>
<text x="137" y="123" font-size="23" font-weight="700" fill="#242823">23:40 + 35분</text><text x="137" y="155" font-size="15" fill="#6D5B39">입력 시각 + 경과 시간</text>
<rect x="289" y="85" width="205" height="100" rx="13" fill="#F5F3E9" stroke="#285E4F" stroke-width="2"/>
<text x="391" y="123" font-size="23" font-weight="700" fill="#242823">1455분</text><text x="391" y="155" font-size="14" fill="#6D5B39">23×60 + 40 + 35</text>
<rect x="543" y="85" width="205" height="100" rx="13" fill="#E6EFE9" stroke="#285E4F" stroke-width="2"/>
<text x="645" y="123" font-size="23" font-weight="700" fill="#242823">00:15</text><text x="645" y="155" font-size="14" fill="#285E4F">(// 60) % 24 · % 60</text>
</g><g fill="none" stroke="#285E4F" stroke-width="2.5"><path d="M248 134 H280"/><path d="M272 127 L280 134 L272 141"/><path d="M502 134 H534"/><path d="M526 127 L534 134 L526 141"/></g>
<text x="390" y="229" font-family="sans-serif" text-anchor="middle" font-size="15" fill="#5A5A51">분 단위로 통일하면 날짜 경계를 넘는 시각도 계산할 수 있습니다.</text>
</svg>